# Deploys the static app to GitHub Pages on every push to main.
# A workflow deploy ignores the CNAME file, so the custom domain is set in the Pages settings
# only after speaker-trainer.js.org resolves (no downtime while the js.org request is open).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site folder (app files only)
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js CNAME css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
